name: CI

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-contracts:
    name: Python and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract validator
        run: python -m pip install jsonschema==4.26.0

      - name: Check setup script
        run: |
          bash -n scripts/setup_dev.sh
          scripts/setup_dev.sh --help

      - name: Test Android tool installers
        run: python -m unittest discover -s scripts/tests -v

      - name: Install ml/tests dependencies
        run: python -m pip install numpy==2.5.3 opencv-python-headless==4.14.0.94 onnxruntime==1.30.0

      - name: Test ml tools (model downloader, NLM segmentation port)
        run: python -m unittest discover -s ml/tests -v

      - name: Validate contract examples and pack manifests
        run: python contracts/validate.py contracts/examples/*.json ml/packs/*/manifest.json

  ml-torch:
    name: ML trainer and ONNX export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install pinned ML packages (CPU torch)
        run: python -m pip install -r ml/requirements.txt

      - name: Test trainer, ONNX export and router evaluation
        run: python -m unittest discover -s ml/tests -v

  android-jvm:
    name: Android JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android 17 preview SDK
        run: android sdk install --beta platforms/android-37.0

      - name: Run engine JVM tests
        working-directory: android
        run: ./gradlew :engine:testDebugUnitTest --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Kotlin-encoded contracts
        run: |
          python -m pip install jsonschema==4.26.0
          python contracts/validate.py android/engine/build/contract-out/*.json
